{% extends "base.html" %}
{% block title %}{{ _('Access denied') }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-shield-x display-1 text-danger"></i>
  <h1 class="mt-3">{{ _('403 – Access denied') }}</h1>
  <p class="text-secondary">{{ _('Your role does not allow this action.') }}</p>
  <a class="btn btn-primary" href="{{ url_for('main.screens') }}">{{ _('Back to screens') }}</a>
</div>
{% endblock %}
